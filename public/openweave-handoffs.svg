<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="t">
  <title id="t">The usual path sends one design through four tools with an export at each step; in OpenWeave the same work happens as tabs on one file on your disk</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 1 L9 5 L0 9 Z" fill="#8e8e93"/>
    </marker>
  </defs>
  <style>
    text { font-family: Inter, "Segoe UI", -apple-system, system-ui, sans-serif; fill: #1d1d1f; }
    .label { font-size: 22px; font-weight: 600; letter-spacing: 0.06em; fill: #6e6e73; }
    .name { font-size: 25px; font-weight: 600; }
    .sub { font-size: 21px; fill: #6e6e73; }
    .exp { font-size: 19px; fill: #8e8e93; font-style: italic; }
    .tab { font-size: 25px; font-weight: 600; fill: #1d1d1f; }
  </style>
  <rect width="1200" height="660" fill="#ffffff"/>

  <text class="label" x="40" y="56">THE USUAL PATH: FOUR TOOLS, FOUR COPIES</text>
  <g>
    <rect x="40" y="84" width="236" height="120" rx="18" fill="#f2f2f4" stroke="#c7c7cc" stroke-width="2"/>
    <text class="name" x="158" y="138" text-anchor="middle">Design tool</text>
    <text class="sub" x="158" y="172" text-anchor="middle">the frames</text>

    <rect x="328" y="84" width="236" height="120" rx="18" fill="#f2f2f4" stroke="#c7c7cc" stroke-width="2"/>
    <text class="name" x="446" y="138" text-anchor="middle">Animation app</text>
    <text class="sub" x="446" y="172" text-anchor="middle">the motion</text>

    <rect x="616" y="84" width="236" height="120" rx="18" fill="#f2f2f4" stroke="#c7c7cc" stroke-width="2"/>
    <text class="name" x="734" y="138" text-anchor="middle">Prototype viewer</text>
    <text class="sub" x="734" y="172" text-anchor="middle">the flow on a phone</text>

    <rect x="904" y="84" width="256" height="120" rx="18" fill="#f2f2f4" stroke="#c7c7cc" stroke-width="2"/>
    <text class="name" x="1032" y="138" text-anchor="middle">Handoff plugin</text>
    <text class="sub" x="1032" y="172" text-anchor="middle">the specs</text>

    <line x1="278" y1="144" x2="324" y2="144" stroke="#8e8e93" stroke-width="2.5" marker-end="url(#a)"/>
    <line x1="566" y1="144" x2="612" y2="144" stroke="#8e8e93" stroke-width="2.5" marker-end="url(#a)"/>
    <line x1="854" y1="144" x2="900" y2="144" stroke="#8e8e93" stroke-width="2.5" marker-end="url(#a)"/>
    <text class="exp" x="301" y="234" text-anchor="middle">export</text>
    <text class="exp" x="589" y="234" text-anchor="middle">export</text>
    <text class="exp" x="877" y="234" text-anchor="middle">export</text>
    <text class="sub" x="600" y="284" text-anchor="middle">…and the file itself lives in someone else's cloud. Every copy drifts.</text>
  </g>

  <line x1="40" y1="330" x2="1160" y2="330" stroke="#e5e5ea" stroke-width="2"/>

  <text class="label" x="40" y="384">OPENWEAVE: ONE FILE, ONE EDITOR</text>
  <rect x="40" y="410" width="1120" height="210" rx="22" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2"/>
  <g>
    <rect x="76" y="446" width="240" height="70" rx="35" fill="#ffffff" stroke="#a9c8ef" stroke-width="1.5"/>
    <text class="tab" x="196" y="490" text-anchor="middle">Design</text>
    <rect x="340" y="446" width="240" height="70" rx="35" fill="#ffffff" stroke="#a9c8ef" stroke-width="1.5"/>
    <text class="tab" x="460" y="490" text-anchor="middle">Motion</text>
    <rect x="604" y="446" width="240" height="70" rx="35" fill="#ffffff" stroke="#a9c8ef" stroke-width="1.5"/>
    <text class="tab" x="724" y="490" text-anchor="middle">Prototype</text>
    <rect x="868" y="446" width="256" height="70" rx="35" fill="#ffffff" stroke="#a9c8ef" stroke-width="1.5"/>
    <text class="tab" x="996" y="490" text-anchor="middle">Dev Mode</text>
  </g>
  <text class="sub" x="600" y="574" text-anchor="middle" style="fill:#424245">Tabs over the same .fig on your own disk. Nothing to export until the work leaves.</text>
</svg>
