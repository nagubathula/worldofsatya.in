<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" role="img" aria-labelledby="t">
  <title id="t">OpenWeave layers: the engine from OpenPencil at the bottom, and the React app, features and desktop shell built on top</title>
  <style>
    text { font-family: Inter, "Segoe UI", -apple-system, system-ui, sans-serif; fill: #1d1d1f; }
    .label { font-size: 22px; font-weight: 600; letter-spacing: 0.06em; fill: #6e6e73; }
    .chip { font-size: 25px; font-weight: 500; }
    .mine rect.card { fill: #eaf2fc; stroke: #2a78d6; stroke-width: 2; }
    .base rect.card { fill: #f2f2f4; stroke: #c7c7cc; stroke-width: 2; }
    .mine rect.pill { fill: #ffffff; stroke: #a9c8ef; stroke-width: 1.5; }
    .base rect.pill { fill: #ffffff; stroke: #d2d2d7; stroke-width: 1.5; }
    .legend { font-size: 22px; fill: #424245; }
  </style>
  <rect width="1200" height="850" fill="#ffffff"/>
  <g transform="translate(0 50)">

  <!-- Desktop and sharing -->
  <g class="mine">
    <rect class="card" x="40" y="40" width="1120" height="150" rx="20"/>
    <text class="label" x="72" y="84">DESKTOP &amp; SHARING</text>
    <rect class="pill" x="72" y="106" width="380" height="56" rx="28"/>
    <text class="chip" x="262" y="143" text-anchor="middle">Electron shell (was Tauri)</text>
    <rect class="pill" x="472" y="106" width="300" height="56" rx="28"/>
    <text class="chip" x="622" y="143" text-anchor="middle">ngrok public links</text>
    <rect class="pill" x="792" y="106" width="336" height="56" rx="28"/>
    <text class="chip" x="960" y="143" text-anchor="middle">Join screen + password</text>
  </g>

  <!-- Features -->
  <g class="mine">
    <rect class="card" x="40" y="210" width="1120" height="226" rx="20"/>
    <text class="label" x="72" y="254">FEATURES</text>
    <rect class="pill" x="72" y="276" width="320" height="56" rx="28"/>
    <text class="chip" x="232" y="313" text-anchor="middle">Motion timeline</text>
    <rect class="pill" x="412" y="276" width="340" height="56" rx="28"/>
    <text class="chip" x="582" y="313" text-anchor="middle">Device-frame prototypes</text>
    <rect class="pill" x="772" y="276" width="356" height="56" rx="28"/>
    <text class="chip" x="950" y="313" text-anchor="middle">Dev Mode + redlines</text>
    <rect class="pill" x="72" y="350" width="320" height="56" rx="28"/>
    <text class="chip" x="232" y="387" text-anchor="middle">Shader layers</text>
    <rect class="pill" x="412" y="350" width="340" height="56" rx="28"/>
    <text class="chip" x="582" y="387" text-anchor="middle">Path editing + pen</text>
    <rect class="pill" x="772" y="350" width="356" height="56" rx="28"/>
    <text class="chip" x="950" y="387" text-anchor="middle">Real-size calibration</text>
  </g>

  <!-- App and SDK -->
  <g class="mine">
    <rect class="card" x="40" y="456" width="1120" height="150" rx="20"/>
    <text class="label" x="72" y="500">APP &amp; SDK, MOVED FROM VUE</text>
    <rect class="pill" x="72" y="522" width="520" height="56" rx="28"/>
    <text class="chip" x="332" y="559" text-anchor="middle">React + Next.js editor app</text>
    <rect class="pill" x="612" y="522" width="516" height="56" rx="28"/>
    <text class="chip" x="870" y="559" text-anchor="middle">Headless React SDK</text>
  </g>

  <!-- Engine (upstream) -->
  <g class="base">
    <rect class="card" x="40" y="626" width="1120" height="150" rx="20"/>
    <text class="label" x="72" y="670">ENGINE, FROM OPENPENCIL</text>
    <rect class="pill" x="72" y="692" width="230" height="56" rx="28"/>
    <text class="chip" x="187" y="729" text-anchor="middle">Skia renderer</text>
    <rect class="pill" x="316" y="692" width="236" height="56" rx="28"/>
    <text class="chip" x="434" y="729" text-anchor="middle">.fig / .pen codec</text>
    <rect class="pill" x="566" y="692" width="190" height="56" rx="28"/>
    <text class="chip" x="661" y="729" text-anchor="middle">Yoga layout</text>
    <rect class="pill" x="770" y="692" width="170" height="56" rx="28"/>
    <text class="chip" x="855" y="729" text-anchor="middle">CLI + MCP</text>
    <rect class="pill" x="954" y="692" width="174" height="56" rx="28"/>
    <text class="chip" x="1041" y="729" text-anchor="middle">P2P sync</text>
  </g>

  </g>

  <!-- Legend -->
  <g transform="translate(796 44)">
    <rect x="0" y="-20" width="22" height="22" rx="6" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2"/>
    <text class="legend" x="32" y="-1">Built by me</text>
    <rect x="190" y="-20" width="22" height="22" rx="6" fill="#f2f2f4" stroke="#c7c7cc" stroke-width="2"/>
    <text class="legend" x="222" y="-1">From OpenPencil</text>
  </g>
</svg>
