<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="t">
  <title id="t">ContentFlow's eight-stage pipeline: Script, Review, Voice Over, Audio Cut, Raw Upload, Editing, Ready, Posted</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 1 L9 5 L0 9 Z" fill="#2a78d6"/>
    </marker>
  </defs>
  <style>
    text { font-family: Inter, "Segoe UI", -apple-system, system-ui, sans-serif; fill: #1d1d1f; }
    .n { font-size: 16px; font-weight: 700; letter-spacing: 0.08em; fill: #2a78d6; }
    .name { font-size: 25px; font-weight: 600; }
    .row { font-size: 19px; font-weight: 600; letter-spacing: 0.06em; fill: #6e6e73; }
  </style>
  <rect width="1200" height="400" fill="#ffffff"/>

  <text class="row" x="40" y="44">WORDS AND SOUND</text>
  <g>
    <rect x="40" y="62" width="246" height="100" rx="16" fill="#ffffff" stroke="#c7c7cc" stroke-width="2"/>
    <text class="n" x="64" y="96">01</text><text class="name" x="64" y="134">Script</text>
    <rect x="326" y="62" width="246" height="100" rx="16" fill="#ffffff" stroke="#c7c7cc" stroke-width="2"/>
    <text class="n" x="350" y="96">02</text><text class="name" x="350" y="134">Review</text>
    <rect x="612" y="62" width="246" height="100" rx="16" fill="#ffffff" stroke="#c7c7cc" stroke-width="2"/>
    <text class="n" x="636" y="96">03</text><text class="name" x="636" y="134">Voice Over</text>
    <rect x="898" y="62" width="262" height="100" rx="16" fill="#ffffff" stroke="#c7c7cc" stroke-width="2"/>
    <text class="n" x="922" y="96">04</text><text class="name" x="922" y="134">Audio Cut</text>
    <line x1="288" y1="112" x2="322" y2="112" stroke="#2a78d6" stroke-width="3" marker-end="url(#a)"/>
    <line x1="574" y1="112" x2="608" y2="112" stroke="#2a78d6" stroke-width="3" marker-end="url(#a)"/>
    <line x1="860" y1="112" x2="894" y2="112" stroke="#2a78d6" stroke-width="3" marker-end="url(#a)"/>
  </g>

  <path d="M1029 164 V200 H163 V250" fill="none" stroke="#2a78d6" stroke-width="3" marker-end="url(#a)"/>

  <text class="row" x="40" y="244" text-anchor="start" style="visibility:hidden">.</text>
  <g>
    <rect x="40" y="254" width="246" height="100" rx="16" fill="#ffffff" stroke="#c7c7cc" stroke-width="2"/>
    <text class="n" x="64" y="288">05</text><text class="name" x="64" y="326">Raw Upload</text>
    <rect x="326" y="254" width="246" height="100" rx="16" fill="#ffffff" stroke="#c7c7cc" stroke-width="2"/>
    <text class="n" x="350" y="288">06</text><text class="name" x="350" y="326">Editing</text>
    <rect x="612" y="254" width="246" height="100" rx="16" fill="#ffffff" stroke="#c7c7cc" stroke-width="2"/>
    <text class="n" x="636" y="288">07</text><text class="name" x="636" y="326">Ready</text>
    <rect x="898" y="254" width="262" height="100" rx="16" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2"/>
    <text class="n" x="922" y="288">08</text><text class="name" x="922" y="326">Posted</text>
    <line x1="288" y1="304" x2="322" y2="304" stroke="#2a78d6" stroke-width="3" marker-end="url(#a)"/>
    <line x1="574" y1="304" x2="608" y2="304" stroke="#2a78d6" stroke-width="3" marker-end="url(#a)"/>
    <line x1="860" y1="304" x2="894" y2="304" stroke="#2a78d6" stroke-width="3" marker-end="url(#a)"/>
  </g>
  <text class="row" x="1160" y="386" text-anchor="end">PICTURE AND PUBLISHING</text>
</svg>
