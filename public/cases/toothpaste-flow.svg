<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t">
  <title id="t">How a paste becomes a clip: the panel reads the clipboard, downloads links with yt-dlp, converts GIFs and WebPs with FFmpeg, then ExtendScript imports the file and places it at the playhead</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 1 L9 5 L0 9 Z" fill="#2a78d6"/>
    </marker>
  </defs>
  <style>
    text { font-family: Inter, "Segoe UI", -apple-system, system-ui, sans-serif; fill: #1d1d1f; }
    .label { font-size: 20px; font-weight: 700; letter-spacing: 0.06em; fill: #6e6e73; }
    .name { font-size: 25px; font-weight: 600; }
    .sub { font-size: 20px; fill: #6e6e73; }
    .edge { font-size: 19px; fill: #424245; font-style: italic; }
  </style>
  <rect width="1200" height="560" fill="#ffffff"/>

  <text class="label" x="40" y="50">YOU</text>
  <rect x="40" y="70" width="250" height="140" rx="18" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2"/>
  <text class="name" x="165" y="128" text-anchor="middle">Paste or drop</text>
  <text class="sub" x="165" y="162" text-anchor="middle">image, file, or link</text>

  <text class="label" x="350" y="50">THE PANEL (HTML + JS)</text>
  <rect x="350" y="70" width="250" height="140" rx="18" fill="#ffffff" stroke="#c7c7cc" stroke-width="2"/>
  <text class="name" x="475" y="128" text-anchor="middle">What is it?</text>
  <text class="sub" x="475" y="162" text-anchor="middle">file, image, or URL</text>

  <rect x="660" y="30" width="250" height="110" rx="18" fill="#ffffff" stroke="#c7c7cc" stroke-width="2"/>
  <text class="name" x="785" y="78" text-anchor="middle">yt-dlp</text>
  <text class="sub" x="785" y="110" text-anchor="middle">download the link</text>

  <rect x="660" y="160" width="250" height="110" rx="18" fill="#ffffff" stroke="#c7c7cc" stroke-width="2"/>
  <text class="name" x="785" y="208" text-anchor="middle">FFmpeg</text>
  <text class="sub" x="785" y="240" text-anchor="middle">GIF / WebP → MP4</text>

  <text class="label" x="40" y="340">PREMIERE PRO (EXTENDSCRIPT)</text>
  <rect x="660" y="360" width="250" height="140" rx="18" fill="#ffffff" stroke="#c7c7cc" stroke-width="2"/>
  <text class="name" x="785" y="418" text-anchor="middle">Import</text>
  <text class="sub" x="785" y="452" text-anchor="middle">into the project</text>

  <rect x="350" y="360" width="250" height="140" rx="18" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2"/>
  <text class="name" x="475" y="418" text-anchor="middle">On the timeline</text>
  <text class="sub" x="475" y="452" text-anchor="middle">at the playhead</text>

  <line x1="292" y1="140" x2="346" y2="140" stroke="#2a78d6" stroke-width="3" marker-end="url(#a)"/>
  <path d="M602 120 H630 V85 H656" fill="none" stroke="#2a78d6" stroke-width="3" marker-end="url(#a)"/>
  <path d="M602 160 H630 V215 H656" fill="none" stroke="#2a78d6" stroke-width="3" marker-end="url(#a)"/>
  <path d="M912 85 H960 V430 H914" fill="none" stroke="#2a78d6" stroke-width="3" marker-end="url(#a)"/>
  <path d="M912 215 H960" fill="none" stroke="#2a78d6" stroke-width="3"/>
  <path d="M475 212 V300 H785 V356" fill="none" stroke="#8e8e93" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#a)"/>
  <text class="edge" x="640" y="290" text-anchor="middle">local files and images go straight in</text>
  <line x1="658" y1="430" x2="604" y2="430" stroke="#2a78d6" stroke-width="3" marker-end="url(#a)"/>

  <text class="edge" x="990" y="250">links: pick quality,</text>
  <text class="edge" x="990" y="278">a time range, or</text>
  <text class="edge" x="990" y="306">audio only (MP3)</text>
</svg>
