<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t">
  <title id="t">The mobile billing flow: pick a table, add items, send the bill to the kitchen order ticket, watch live bills, and print at the end</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 1 L9 5 L0 9 Z" fill="#2a78d6"/>
    </marker>
  </defs>
  <style>
    text { font-family: Inter, "Segoe UI", -apple-system, system-ui, sans-serif; fill: #1d1d1f; }
    .step { font-size: 15px; font-weight: 700; letter-spacing: 0.08em; fill: #2a78d6; }
    .name { font-size: 25px; font-weight: 600; }
    .sub { font-size: 20px; fill: #6e6e73; }
    .note { font-size: 20px; fill: #6e6e73; font-style: italic; }
  </style>
  <rect width="1200" height="420" fill="#ffffff"/>

  <g>
    <rect x="30" y="70" width="200" height="150" rx="18" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2"/>
    <text class="step" x="130" y="108" text-anchor="middle">STEP 1</text>
    <text class="name" x="130" y="146" text-anchor="middle">Pick a table</text>
    <text class="sub" x="130" y="180" text-anchor="middle">by number</text>

    <rect x="268" y="70" width="200" height="150" rx="18" fill="#ffffff" stroke="#c7c7cc" stroke-width="2"/>
    <text class="step" x="368" y="108" text-anchor="middle">STEP 2</text>
    <text class="name" x="368" y="146" text-anchor="middle">Add items</text>
    <text class="sub" x="368" y="180" text-anchor="middle">search or tap</text>

    <rect x="506" y="70" width="200" height="150" rx="18" fill="#ffffff" stroke="#c7c7cc" stroke-width="2"/>
    <text class="step" x="606" y="108" text-anchor="middle">STEP 3</text>
    <text class="name" x="606" y="146" text-anchor="middle">Send bill</text>
    <text class="sub" x="606" y="180" text-anchor="middle">a temporary bill</text>

    <rect x="744" y="70" width="200" height="150" rx="18" fill="#ffffff" stroke="#c7c7cc" stroke-width="2"/>
    <text class="step" x="844" y="108" text-anchor="middle">STEP 4</text>
    <text class="name" x="844" y="146" text-anchor="middle">Add to KOT</text>
    <text class="sub" x="844" y="180" text-anchor="middle">the kitchen sees it</text>

    <rect x="982" y="70" width="190" height="150" rx="18" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2"/>
    <text class="step" x="1077" y="108" text-anchor="middle">STEP 5</text>
    <text class="name" x="1077" y="146" text-anchor="middle">Live bills</text>
    <text class="sub" x="1077" y="180" text-anchor="middle">print at the end</text>

    <line x1="232" y1="145" x2="264" y2="145" stroke="#2a78d6" stroke-width="3" marker-end="url(#a)"/>
    <line x1="470" y1="145" x2="502" y2="145" stroke="#2a78d6" stroke-width="3" marker-end="url(#a)"/>
    <line x1="708" y1="145" x2="740" y2="145" stroke="#2a78d6" stroke-width="3" marker-end="url(#a)"/>
    <line x1="946" y1="145" x2="978" y2="145" stroke="#2a78d6" stroke-width="3" marker-end="url(#a)"/>
  </g>

  <path d="M1077 222 V300 H368 V226" fill="none" stroke="#8e8e93" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#a)"/>
  <text class="note" x="722" y="338" text-anchor="middle">Another round for the same table adds to the same live bill until checkout</text>
</svg>
