<!doctype html><html><head><meta charset="utf-8"><title>billjot</title><link rel="stylesheet" href="style.css"><script type="importmap">{"imports":{"three":"../../node_modules/three/build/three.module.js"}}</script></head><body><script type="module">
import { THREE, panels, piece, stage, strip, V, curve, mesh, texture } from "./lib.js";
panels([
  { bg: "linear-gradient(165deg,#17c784,#02a668)", text: "From table<br>to bill,<br>in a tap." },
  { bg: "linear-gradient(165deg,#ecfbf3,#cdf2df)", text: "Scan, order,<br>straight to<br>the kitchen." },
  { bg: "linear-gradient(165deg,#ffcf4d,#ffb71f)", text: "No internet?<br>Keep<br>billing." },
  { bg: "linear-gradient(165deg,#123a2c,#0a2a1f)", fg: "#fff", text: "Know the<br>day as it<br>happens." },
]);
const { scene, done } = stage({ env: 0.42, key: 1.15, ambient: 0.1 });
await document.fonts.load("700 40px SFx"); await document.fonts.load("500 40px SFx");
// Printed paper. u runs down the bill, v across it.
const TW = 640, TH = 2400;
const bill = texture(TH, TW, (g) => {
  g.fillStyle = "#fffdf8"; g.fillRect(0, 0, TH, TW);
  g.translate(0, TW); g.rotate(-Math.PI / 2);
  g.fillStyle = "#1a1a1a"; let y = 90;
  const row = (a, b, big) => { g.font = `${big ? 700 : 500} ${big ? 54 : 44}px SFx`; g.textAlign = "left"; g.fillText(a, 56, y); if (b) { g.textAlign = "right"; g.fillText(b, TW - 56, y); } y += big ? 84 : 72; };
  const mid = (t, s, w = 500) => { g.font = `${w} ${s}px SFx`; g.textAlign = "center"; g.fillText(t, TW / 2, y); y += s * 1.5; };
  const rule = () => { y -= 22; g.setLineDash([14, 10]); g.lineWidth = 4; g.strokeStyle = "#1a1a1a"; g.beginPath(); g.moveTo(56, y); g.lineTo(TW - 56, y); g.stroke(); y += 66; };
  for (const [t, rows, sum] of [["Table 04", [["2 × Special Tea", "40"], ["1 × Paneer Tikka", "180"]], "₹220"], ["Table 07", [["4 × Samosa", "60"], ["2 × Special Tea", "40"]], "₹100"], ["Counter A", [["2 × Samosa", "30"], ["1 × Special Tea", "20"]], "₹50"]]) {
    g.fillStyle = "#04a15f"; mid("billjot", 84, 700); g.fillStyle = "#1a1a1a"; mid(t, 44); rule();
    rows.forEach((r) => row(...r)); rule(); row("Total", sum, true); y += 8;
    let x = 60; for (let i = 0; x < TW - 70; i++) { const w = [5, 11, 7, 16][(i * 7 + i * i) % 4]; g.fillRect(x, y - 30, w, 96); x += w + [6, 12, 8][i % 3]; }
    y += 196;
  }
});
const paper = new THREE.MeshPhysicalMaterial({ map: bill, side: THREE.DoubleSide, roughness: 0.75 });
// Roll, then a long drop that turns and travels right.
const RW = 214, roll = V(206, -440, 10), R = 76;
const P = [], D = [];
for (let i = 0; i <= 900; i++) { const a = (i / 900) * 5.25 * 2 * Math.PI, rr = 20 + (R - 20) * (i / 900); P.push(V(roll.x, roll.y + rr * Math.cos(a), roll.z + rr * Math.sin(a))); D.push(V(1, 0, 0)); }
const end = P.at(-1);
const c = curve([[end.x, end.y, end.z], [206, -490, 92], [206, -550, 100], [206, -620, 80], [222, -696, 70], [266, -764, 76], [330, -808, 80], [410, -828, 60], [520, -826, 20], [680, -806, -30], [840, -812, 30], [960, -842, 80], [1080, -850, 50], [1220, -820, -30], [1360, -790, 10], [1500, -804, 70], [1660, -838, 60], [1780, -836, 0], [1920, -810, -40]]);
const Q = c.getSpacedPoints(2400);
Q.forEach((q, i) => { if (!i) return;
  const t = c.getTangentAt(i / 2400), n = V(-t.y, t.x, 0).normalize();
  // Width stays across the paper and leans with the waves.
  const lean = 0.5 * Math.sin(q.x / 150) * Math.min(1, Math.max(0, (q.x - 300) / 200));
  P.push(q); D.push(V(n.x * Math.cos(lean), n.y * Math.cos(lean), Math.sin(lean)).normalize());
});
mesh(scene, strip(P, D, RW, { uLen: RW * TH / TW }), paper);
for (const sx of [-1, 1]) { const o = mesh(scene, new THREE.CylinderGeometry(R - 2, R - 2, 2, 64), new THREE.MeshStandardMaterial({ color: "#efe9dd", roughness: 0.9 })); o.rotation.z = Math.PI / 2; o.position.copy(roll).add(V(sx * (RW / 2 - 2), 0, 0)); }
await piece({ src: "bj-qr2.png", left: 492, top: 300, width: 376, rot: -3, r: 36, bg: "#171717" });
await piece({ src: "bj-off4.png", x: 20, y: 30, w: 1320, h: 240, left: 940, top: 300, width: 396, rot: -2, r: 20, pad: 12, bg: "#0a0a0a" });
await piece({ src: "bj-off4.png", x: 98, y: 592, w: 1080, h: 340, left: 962, top: 402, width: 362, rot: 3, r: 22, pad: 8, bg: "#101010", line: "#2b2b2b" });
await piece({ src: "bj-off4.png", x: 1510, y: 592, w: 1080, h: 340, left: 950, top: 546, width: 362, rot: -3, r: 22, pad: 8, bg: "#101010", line: "#2b2b2b" });
await piece({ src: "bj-sales.png", x: 12, y: 12, w: 1180, h: 460, left: 1404, top: 290, width: 372, rot: -3, r: 20, bg: "#0b0b0b", line: "#3c4a44" });
await piece({ src: "bj-bills.png", x: 12, y: 12, w: 1180, h: 460, left: 1424, top: 424, width: 372, rot: 3, r: 20, bg: "#0b0b0b", line: "#3c4a44" });
await piece({ src: "bj-stock2.png", x: 8, y: 8, left: 1404, top: 566, width: 372, rot: -2, r: 26, bg: "#0a0a0a", line: "#3c4a44" });
await done();
</script></body></html>
