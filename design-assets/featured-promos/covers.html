if (name === "toothpaste") {

  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2)); g.setIndex(idx); g.computeVertexNormals();
  mesh(scene, g, new THREE.MeshPhysicalMaterial({ map: stripes, roughness: 0.2, clearcoat: 1, clearcoatRoughness: 0.12, side: THREE.DoubleSide }));
  const tube = new THREE.Group(), L = 290, A = 160, B = 96, tp = [], tu = [], ti = [];
  for (let i = 0; i <= B; i++) { const t = i / B, dent = 1 - 0.18 * Math.exp(-(((t - 0.45) / 0.14) ** 2)), rx = 76 + 28 * t, rz = Math.max(3, 76 * (1 - t) ** 0.62) * dent;
    for (let j = 0; j <= A; j++) { const a = (j / A) * 2 * Math.PI; tp.push(rx * Math.sin(a), t * L, rz * Math.cos(a)); tu.push(j / A, t); } }
